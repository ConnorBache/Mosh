[workspace]
members = ["core", "cli", "desktop/src-tauri"]
default-members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.2.0-preview.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mosh-core = { path = "core" }
