name: Windows build

on:
  push:
    paths: ['Cargo.*', 'core/**', 'cli/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      desktop_smoke:
        description: Exercise the installed app through WebView2 debugging
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test the Rust workspace
        run: |
          rustup update stable
          cargo +stable test --locked
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build the installer
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis --ci
      - name: Build the CLI
        run: cargo +stable build --locked --release -p mosh
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item target/release/bundle/nsis/*-setup.exe release/
          Compress-Archive -LiteralPath target/release/mosh.exe,README.md,docs/release-preview.md -DestinationPath "release/Mosh-$version-cli-windows-x64.zip"
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-windows-x64
          path: release/
          if-no-files-found: error
      - name: Install on a clean runner and exercise the real desktop
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $previous = Join-Path $env:RUNNER_TEMP 'MoshPrior'
          gh release download v0.1.0 --repo "${{ github.repository }}" --dir $previous --pattern Mosh-cli-windows-x64.zip --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published upgrade fixture CLI' }
          $zip = Join-Path $previous 'Mosh-cli-windows-x64.zip'
          $expected = ((Get-Content (Join-Path $previous 'SHA256SUMS.txt')) | Where-Object { $_ -match 'Mosh-cli-windows-x64\.zip$' }) -split '\s+' | Select-Object -First 1
          if (-not $expected -or (Get-FileHash -LiteralPath $zip).Hash -ne $expected) { throw 'Prior release checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $previous
          node desktop/tests/install-smoke.mjs $installer.FullName target/release/mosh.exe (Join-Path $previous 'mosh.exe')
